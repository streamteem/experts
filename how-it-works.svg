<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="130" viewBox="0 0 1100 130" role="img" aria-labelledby="title">
  <title id="title">Copy an Expert folder, open it in Cursor, talk to it as your assistant, and keep each appointment, ticket, or work task in its own folder</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#57606a"/>
    </marker>
  </defs>
  <g fill="#eef2ff" stroke="#8b9cf7" stroke-width="1.5">
    <rect x="8" y="18" width="236" height="94" rx="8"/>
    <rect x="292" y="18" width="236" height="94" rx="8"/>
    <rect x="576" y="18" width="236" height="94" rx="8"/>
    <rect x="860" y="18" width="236" height="94" rx="8"/>
  </g>
  <g stroke="#57606a" stroke-width="1.75" marker-end="url(#arrow)">
    <line x1="248" y1="65" x2="282" y2="65"/>
    <line x1="532" y1="65" x2="566" y2="65"/>
    <line x1="816" y1="65" x2="850" y2="65"/>
  </g>
  <g fill="#1f2328" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle">
    <text x="126" y="56">1. Copy the Expert folder</text>
    <text x="126" y="78">for the role you want</text>
    <text x="410" y="56">2. Open that Expert folder</text>
    <text x="410" y="78">in Cursor</text>
    <text x="694" y="56">3. Talk to it as your</text>
    <text x="694" y="78">assistant for that role</text>
    <text x="978" y="50">4. Each appointment, ticket,</text>
    <text x="978" y="72">or work task gets its</text>
    <text x="978" y="94">own folder</text>
  </g>
</svg>
